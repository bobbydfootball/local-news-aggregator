name: Keep Streamlit app awake
on:
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours -- comfortably under Streamlit
                             # Community Cloud's 12-hour hibernation window
  workflow_dispatch: {}     # allow manual trigger to test immediately
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app
        run: |
          # No -L here deliberately: an earlier version followed redirects
          # and hit curl's "too many redirects" error (exit 47), because
          # Streamlit's session/cookie negotiation on this domain bounces
          # a plain curl request in a redirect loop without a browser's
          # cookie jar to carry state between hops. The redirect response
          # itself (303) already means the request reached the app's
          # origin and was logged there, which is what should matter for
          # the hibernation check -- so we just record whatever status
          # comes back without trying to follow it further.
          curl -s -o /dev/null -w "HTTP status: %{http_code}\n" "https://bo6-local-news-aggregator.streamlit.app/"
