name: One-off dedupe existing articles
on:
  workflow_dispatch: {}   # manual trigger only from the GitHub UI -- this
                           # is a single-use cleanup job, not a recurring one
concurrency:
  group: ingest-workflow   # same group as the scheduled ingest workflow, so
                            # this queues behind it instead of racing to
                            # commit/push data/news.db at the same time
  cancel-in-progress: false
jobs:
  dedupe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m src.dedupe_existing
      - name: Commit deduped database
        run: |
          git config user.name "news-ingest-bot"
          git config user.email "actions@github.com"
          git add data/news.db
          git diff --cached --quiet || git commit -m "One-off: merge duplicate articles (BLOX slug-change bug)"
          git push
