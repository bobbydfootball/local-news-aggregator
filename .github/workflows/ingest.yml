name: Ingest news feeds on: schedule: - cron: "0 * * * *" workflow_dispatch: {} jobs: ingest: runs-on: ubuntu-latest steps: - uses: actions/checkout@v4 - uses: actions/setup-python@v5 with: python-version: "3.11" - run: pip install -r requirements.txt - run: python -m src.load_config - run: python -m src.verify_feeds - run: python -m src.ingest - name: Commit updated database run: | git config user.name "news-ingest-bot" git config user.email "actions@github.com" git add data/news.db git diff --cached --quiet || git commit -m "Scheduled news ingest" git push
