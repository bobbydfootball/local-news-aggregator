name: Ingest news feeds

on:
  schedule:
    - cron: "15,45 * * * *"   # hourly
  workflow_dispatch: {}     # allow manual trigger from GitHub UI
  
concurrency:
  group: ingest-workflow
  cancel-in-progress: false   # queue overlapping runs instead of letting them race and fight over the final git push (data/news.db is binary, so a merge conflict there can't auto-resolve the way text files can)

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python -m src.load_config
      - run: python -m src.verify_feeds
      - run: python -m src.ingest

      - name: Ingest Ticketmaster concerts
        continue-on-error: true   # a Ticketmaster outage/bad key should never block committing the rest of the pipeline's results
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: python -m src.ingest_ticketmaster

      - name: Commit updated database
        run: |
          git config user.name "news-ingest-bot"
          git config user.email "actions@github.com"
          git add data/news.db
          git diff --cached --quiet || git commit -m "Scheduled news ingest"
          git push
