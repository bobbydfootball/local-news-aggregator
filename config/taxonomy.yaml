# Top-level news types. `sort_order` controls display order in the app.
# `color` is a hex value used for the Streamlit UI accent per section.
#
# This taxonomy mixes geographic categories (Waukesha) with topical
# categories (Sports, State, Politics & Government, Events) by deliberate
# choice -- Waukesha acts as an "everything local to Waukesha" bucket so a
# single article never needs to appear in more than one section. Milwaukee
# County content lives under "State" (no dedicated Milwaukee category).
#
# IMPORTANT: renaming/removing a category here now cleans up automatically
# -- load_config.py deletes old news_types rows (and their article tags)
# that are no longer in this file, the next time it runs. No manual
# data/news.db deletion needed for category changes anymore.
news_types:
  - slug: waukesha
    name: "Waukesha"
    color: "#16A34A"       # green
    sort_order: 1
  - slug: sports
    name: "Sports"
    color: "#EA580C"       # orange
    sort_order: 2
  - slug: state
    name: "State"
    color: "#7C3AED"       # purple
    sort_order: 3
  - slug: politics
    name: "Politics & Government"
    color: "#2563EB"       # blue
    sort_order: 4
  - slug: events
    name: "Events"
    color: "#6B7280"       # gray -- signals "placeholder, not live yet"
    sort_order: 5

# Regions form a hierarchy: state > county > city.
# Still used as the second-level grouping within each news type above --
# e.g. the "Waukesha" category groups its articles into City of Waukesha /
# Waukesha County sub-sections; "Sports" groups into City of Waukesha
# (Freeman PREP) vs Wisconsin (pro/college teams).
regions:
  - slug: waukesha-city
    name: "City of Waukesha"
    level: city
    parent_slug: waukesha-county
    sort_order: 1
  - slug: waukesha-county
    name: "Waukesha County"
    level: county
    parent_slug: wisconsin
    sort_order: 2
  - slug: milwaukee-county
    name: "Milwaukee County"
    level: county
    parent_slug: wisconsin
    sort_order: 3
  - slug: wisconsin
    name: "Wisconsin (Statewide)"
    level: state
    parent_slug: null
    sort_order: 4

# Sports uses a separate axis (local team vs. state pro/college team)
# rather than the geography hierarchy above.
sports_scopes:
  - slug: local_teams
    name: "Local Teams"
    sort_order: 1
  - slug: state_teams
    name: "State Pro & College Teams"
    sort_order: 2

state_teams:
  - "Milwaukee Brewers"
  - "Milwaukee Bucks"
  - "Green Bay Packers"
  - "Wisconsin Badgers"
