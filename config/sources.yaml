# Source registry.
#
# `feed_url` entries marked "VERIFY" were identified via web research but not
# yet confirmed to be live, working RSS endpoints -- run
# `python -m src.verify_feeds` (via the GitHub Actions workflow) to check
# them and flag anything dead or moved.
#
# `default_news_types` / `default_region` are applied to every article from
# that feed unless the feed is split by topic (e.g. a paper that publishes
# separate politics/sports feeds -- in that case, add one entry per feed).
#
# `sports_scope` only applies when a news type includes "sports".
#
# IMPORTANT: if you remove an entry from this file, re-run load_config so
# the database marks it 'removed' -- otherwise verify_feeds will keep
# checking it forever (see src/load_config.py for how this sync works).

sources:
  # --- Waukesha / Waukesha County ---
  - name: "Waukesha Freeman (GMToday)"
    base_url: "https://www.gmtoday.com/the_freeman/"
    feed_url: "https://www.gmtoday.com/search/?f=rss&t=article&c=the_freeman&l=50&s=start_time&sd=desc"   # VERIFY - BLOX CMS pattern, replaces dead /rss/ guess
    default_region: waukesha-city
    default_news_types: [politics, community, public_safety]

  - name: "Wisconsin Newspaper Association Wire"
    base_url: "https://www.wnanews.com/"
    feed_url: "https://www.wnanews.com/feed"
    default_region: waukesha-county
    default_news_types: [politics, community]

  # Lake Country Now and MyCommunityNOW Hub removed: Lake Country Now
  # returned HTTP 402 (same Gannett-network blocking as MJS and Bucks Wire);
  # MyCommunityNOW's domain no longer resolves at all (likely retired/folded
  # into another Gannett property).

  # --- Milwaukee County ---
  # Milwaukee Journal Sentinel intentionally omitted: both the guessed
  # subdomain and the confirmed Arc XP outbound-feeds URL returned HTTP 402
  # (Payment Required) -- Gannett appears to be blocking/paywalling
  # automated feed access network-wide, not a URL problem. Worth periodically
  # re-testing by hand, but not worth chasing further right now.

  - name: "WISN 12 News"
    base_url: "https://www.wisn.com/"
    feed_url: "https://www.wisn.com/topstories-rss"
    default_region: milwaukee-county
    default_news_types: [politics, community, public_safety]

  - name: "CBS58 Milwaukee"
    base_url: "https://www.cbs58.com/"
    feed_url: "https://www.cbs58.com/rss"
    default_region: milwaukee-county
    default_news_types: [public_safety, politics]

  - name: "Milwaukee Independent"
    base_url: "https://www.milwaukeeindependent.com/"
    feed_url: "https://www.milwaukeeindependent.com/feed/"
    default_region: milwaukee-county
    default_news_types: [community]

  # --- Statewide ---
  - name: "Wisconsin Examiner"
    base_url: "https://wisconsinexaminer.com/"
    feed_url: "https://wisconsinexaminer.com/feed/"
    default_region: wisconsin
    default_news_types: [politics, state_general]

  # MacIver Institute removed: HTTP 403, actively blocking automated requests.
  # Empower Wisconsin removed: feed parses but returns 0 entries, and
  # independent media-monitoring data suggests the outlet has published
  # very little in recent months -- not a URL problem, just low output.

  - name: "Wisconsin Right Now"
    base_url: "https://www.wisconsinrightnow.com/"
    feed_url: "https://www.wisconsinrightnow.com/feed/"   # VERIFY
    default_region: wisconsin
    default_news_types: [politics, state_general]

  - name: "Badger Institute"
    base_url: "https://www.badgerinstitute.org/"
    feed_url: "https://www.badgerinstitute.org/feed/"   # VERIFY
    default_region: wisconsin
    default_news_types: [politics, state_general]

  # --- State sports teams (official/reliable team-specific feeds) ---
  - name: "Green Bay Packers (Official)"
    base_url: "https://www.packers.com/"
    feed_url: "https://www.packers.com/rss/news"
    default_region: wisconsin
    default_news_types: [sports]
    sports_scope: state_teams

  - name: "Milwaukee Brewers - MLB Trade Rumors"
    base_url: "https://www.mlbtraderumors.com/milwaukee-brewers/"
    feed_url: "https://www.mlbtraderumors.com/milwaukee-brewers/feed"
    default_region: wisconsin
    default_news_types: [sports]
    sports_scope: state_teams

  # Milwaukee Bucks - Bucks Wire removed: HTTP 402, same Gannett/USA Today
  # Wire Network blocking pattern as MJS and Lake Country Now. No confirmed
  # working Bucks feed found yet -- Milwaukee Bucks coverage is currently a
  # gap, worth revisiting with a non-Gannett source.

  - name: "Wisconsin Badgers Football (Official)"
