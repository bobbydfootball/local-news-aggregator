# Source registry.
#
# `feed_url` entries marked "VERIFY" were identified via web research but not
# yet confirmed to be live, working RSS endpoints -- run
# `python -m src.verify_feeds` (via the GitHub Actions workflow) to check
# them and flag anything dead or moved.
#
# `default_news_types` is now a SINGLE-item list for every source, by design
# -- the taxonomy was restructured so every article resolves to exactly one
# category (no more cross-listing/duplication across sections).
#
# `sports_scope` only applies to team categories (packers/brewers/bucks/
# badgers/local_sports).
#
# `sports_keyword` / `sports_keyword_scope` (optional): if a feed's title
# contains this keyword, that specific article is reclassified as sports
# (with sports_keyword_scope) instead of getting this source's normal
# default_news_types.

sources:
  # --- Waukesha (City + County together) ---
  - name: "Waukesha Freeman (GMToday) - News Section"
    base_url: "https://www.gmtoday.com/the_freeman/news/"
    feed_url: "https://www.gmtoday.com/search/?f=rss&t=article&c=the_freeman/news&l=100&s=start_time&sd=desc"
    default_region: waukesha-city
    default_news_types: [waukesha]

  - name: "Wisconsin Newspaper Association Wire"
    base_url: "https://www.wnanews.com/"
    feed_url: "https://www.wnanews.com/feed"
    default_region: waukesha-county
    default_news_types: [waukesha]

  - name: "Waukesha Freeman (GMToday) - Sports Section"
    base_url: "https://www.gmtoday.com/the_freeman/sports/"
    feed_url: "https://www.gmtoday.com/search/?f=rss&t=article&c=the_freeman/sports&l=50&s=start_time&sd=desc"
    default_region: waukesha-city
    default_news_types: [local_sports]

  # --- State (Milwaukee County news + general statewide interest) ---
  - name: "CBS58 Milwaukee"
    base_url: "https://www.cbs58.com/"
    feed_url: "https://www.cbs58.com/rss"
    default_region: milwaukee-county
    default_news_types: [state]

  - name: "Milwaukee Independent"
    base_url: "https://www.milwaukeeindependent.com/"
    feed_url: "https://www.milwaukeeindependent.com/feed/"
    default_region: milwaukee-county
    default_news_types: [state]

  # --- Politics & Government (statewide) ---
  - name: "Wisconsin Examiner"
    base_url: "https://wisconsinexaminer.com/"
    feed_url: "https://wisconsinexaminer.com/feed/"
    default_region: wisconsin
    default_news_types: [politics]

  - name: "Wisconsin Right Now"
    base_url: "https://www.wisconsinrightnow.com/"
    feed_url: "https://www.wisconsinrightnow.com/feed/"
    default_region: wisconsin
    default_news_types: [politics]

  - name: "Badger Institute"
    base_url: "https://www.badgerinstitute.org/"
    feed_url: "https://www.badgerinstitute.org/feed/"
    default_region: wisconsin
    default_news_types: [politics]

  - name: "The Heartland Post"
    base_url: "https://heartlandpost.com/"
    feed_url: "https://heartlandpost.com/feed/"
    default_region: wisconsin
    default_news_types: [politics]

  # --- World ---
  - name: "Fox News - World"
    base_url: "https://www.foxnews.com/world"
    feed_url: "https://moxie.foxnews.com/google-publisher/world.xml"
    default_region: wisconsin
    default_news_types: [world]

  # --- Packers ---
  - name: "Green Bay Packers (Official)"
    base_url: "https://www.packers.com/"
    feed_url: "https://www.packers.com/rss/news"
    default_region: wisconsin
    default_news_types: [packers]
    sports_scope: state_teams

  # --- Brewers ---
  - name: "Milwaukee Brewers (Official)"
    base_url: "https://www.mlb.com/brewers"
